[env:esp32s3]
; Pinned to IDF 5.5.x: the project uses the core component "json", which was
; removed in IDF 6; unpinned, PlatformIO pulls espressif32@7.x (IDF 6.0.1)
; and the build aborts ("Failed to resolve component 'json'").
platform = espressif32@6.13.0
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
framework = espidf
; network.json (provisioning defaults): the pre-script generates
; src/network_json_gen.c (g_network_json) from it — more robust than embed_txtfiles.
; sign_firmware appends the RSA-3072 signature block (signed OTA updates;
; PlatformIO bypasses IDF's own signing step, hence as a post-action).
extra_scripts =
    pre:tools/lint_datapoints.py
    pre:tools/ensure_network_json.py
    pre:tools/gen_build_info.py
    post:tools/sign_firmware.py
upload_port = /dev/ttyACM0
upload_speed = 460800
upload_flags =
    --before=no_reset
    --after=hard_reset
monitor_port = /dev/ttyACM0
monitor_speed = 115200

; OTA environment: builds firmware that is then uploaded to the server via flash.sh
[env:esp32s3_ota]
extends = env:esp32s3
upload_protocol = custom
upload_command = ${PROJECT_DIR}/flash.sh ota

; Production environment (series production): identical image for all devices.
; Client certificate/key are NOT embedded (ensure_network_json.py
; checks PIOENV) — the device identity comes from the factory NVS partition.
; Signing is mandatory (sign_firmware.py aborts without a key). Orchestration
; via tools/build_release.py, not directly via pio run.
[env:esp32s3_prod]
extends = env:esp32s3
