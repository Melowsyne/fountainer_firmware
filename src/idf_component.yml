## Managed Components (ESP-IDF Component Manager).
## esp_websocket_client is no longer part of the core bundle as of ESP-IDF 5.x;
## it is loaded from the registry (used by task_com for the server communication).
dependencies:
  idf:
    version: ">=5.0"
  espressif/esp_websocket_client:
    version: "^1.2.0"
